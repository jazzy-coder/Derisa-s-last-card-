<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Derisa’s Last Card — Log in</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050d;--ink:#f6efe0;--mute:#a79fb3;--gold:#e8b84f;--gold2:#ffe29a;--ruby:#c0243a;--cyan:#38e8ff;--glass:rgba(20,14,34,.62);--line:rgba(232,184,79,.28);--ok:#5cf2a0;--bad:#ff5d73;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#07050d}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Rajdhani,system-ui,sans-serif;font-size:18px;overflow-x:hidden;display:grid;place-items:center}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.aura{position:fixed;inset:-20%;z-index:0;background:radial-gradient(40% 35% at 20% 20%,rgba(192,36,58,.35),transparent 70%),radial-gradient(45% 40% at 85% 80%,rgba(56,232,255,.2),transparent 70%),radial-gradient(50% 50% at 50% 50%,rgba(232,184,79,.12),transparent 70%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(3%,-4%) scale(1.08)}}
.grid{position:fixed;inset:auto 0 0 0;height:45vh;z-index:0;background:linear-gradient(transparent,rgba(232,184,79,.14)),repeating-linear-gradient(90deg,rgba(232,184,79,.18) 0 1px,transparent 1px 60px),repeating-linear-gradient(0deg,rgba(232,184,79,.18) 0 1px,transparent 1px 40px);transform:perspective(380px) rotateX(58deg);transform-origin:bottom;mask-image:linear-gradient(transparent,#000 70%);-webkit-mask-image:linear-gradient(transparent,#000 70%)}
main{position:relative;z-index:2;width:min(1040px,100%);padding:24px 18px;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
/* card stage */
.stage{position:relative;height:min(560px,62vh);perspective:1100px;display:grid;place-items:center}
.card{position:absolute;width:min(270px,52vw);aspect-ratio:5/7;border-radius:16px;background:#f3ead7 center/cover no-repeat;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 40px rgba(232,184,79,.25);transform-style:preserve-3d;transition:transform .15s ease-out}
.card.back{transform:translate(-62px,16px) rotate(-12deg) rotateY(calc(var(--ry,0)*1deg)) rotateX(calc(var(--rx,0)*1deg));animation:bob 6s ease-in-out infinite}
.card.face{transform:translate(62px,-10px) rotate(9deg) rotateY(calc(var(--ry,0)*1deg)) rotateX(calc(var(--rx,0)*1deg));animation:bob 6s ease-in-out -3s infinite}
@keyframes bob{50%{margin-top:-14px}}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);background-size:250% 100%;animation:sheen 5s linear infinite;mix-blend-mode:overlay}
@keyframes sheen{from{background-position:150% 0}to{background-position:-50% 0}}
/* panel */
.panel{position:relative;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:30px 28px 26px;box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 30px 80px rgba(0,0,0,.55)}
.panel::before{content:"";position:absolute;inset:-1px;border-radius:27px;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 60%,var(--gold2),var(--cyan),transparent 90%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.icon{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;border:2px dashed var(--gold);display:grid;place-items:center;overflow:hidden;background:rgba(232,184,79,.08);box-shadow:0 0 30px rgba(232,184,79,.3)}
.icon img{width:100%;height:100%;object-fit:cover;display:none}
.icon.has img{display:block}.icon.has{border-style:solid}
.icon span{font-size:34px;color:var(--gold)}
.icon.has span{display:none}
h1{font-family:"Cinzel Decorative",serif;font-weight:900;font-size:clamp(26px,5vw,38px);line-height:1.1;text-align:center;margin:0;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#a9711f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(232,184,79,.35))}
.tag{text-align:center;color:var(--mute);margin:8px 0 22px;letter-spacing:.06em}
label{display:block;font-weight:600;margin:0 0 6px;color:var(--gold2)}
.field{position:relative;margin-bottom:16px}
input{width:100%;height:50px;padding:0 48px 0 16px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(8,5,16,.7);color:var(--ink);font:500 18px Rajdhani,sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,232,255,.2),0 0 22px rgba(56,232,255,.25)}
input.bad{border-color:var(--bad)}input.good{border-color:var(--ok)}
.eye{position:absolute;right:6px;bottom:5px;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.eye:hover{color:var(--gold2)}
button:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.rules{margin:-4px 0 18px;font-size:15px;color:var(--mute);display:flex;gap:8px;align-items:center}
.rules i{width:10px;height:10px;border-radius:50%;background:#4a4458;transition:.25s;flex:none}
.rules.ok i{background:var(--ok);box-shadow:0 0 10px var(--ok)}.rules.ok{color:var(--ok)}
.err{min-height:20px;color:var(--bad);font-size:15px;margin:-8px 0 8px}
.btn{width:100%;height:52px;border-radius:12px;border:0;cursor:pointer;font:700 19px Rajdhani,sans-serif;letter-spacing:.04em;transition:transform .15s,box-shadow .25s}
.btn:active{transform:scale(.98)}
.go{color:#1a1000;background:linear-gradient(100deg,var(--gold2),var(--gold),#ffd36b,var(--gold));background-size:220% 100%;box-shadow:0 8px 30px rgba(232,184,79,.4);animation:shine 4s linear infinite}
.go:hover{box-shadow:0 8px 42px rgba(232,184,79,.7)}
@keyframes shine{to{background-position:-220% 0}}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.guest{background:transparent;color:var(--cyan);border:1px solid rgba(56,232,255,.5)}
.guest:hover{background:rgba(56,232,255,.1);box-shadow:0 0 24px rgba(56,232,255,.3)}
.foot{text-align:center;margin:16px 0 0;font-size:14px;color:var(--mute)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:20px;border-radius:14px;background:rgba(8,5,16,.7);border:1px solid rgba(255,255,255,.1)}
.tab{height:42px;border:0;border-radius:10px;background:transparent;color:var(--mute);font:700 17px Rajdhani,sans-serif;cursor:pointer;transition:.25s}
.tab[aria-selected="true"]{background:linear-gradient(100deg,var(--gold2),var(--gold));color:#1a1000;box-shadow:0 0 18px rgba(232,184,79,.4)}
.su{display:none}body[data-mode="signup"] .su{display:block}body[data-mode="signup"] .logonly{display:none}
#toast{position:fixed;z-index:9;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:#150f24;border:1px solid var(--gold);padding:12px 20px;border-radius:12px;transition:transform .4s cubic-bezier(.2,1.2,.4,1);max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
@media(max-width:860px){main{grid-template-columns:1fr;gap:6px}.stage{height:230px;order:-1}.card{width:130px}.card.back{transform:translate(-40px,6px) rotate(-12deg)}.card.face{transform:translate(40px,-4px) rotate(9deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07050d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Last Card">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}</style>
</head>
<body>
<div class="aura"></div><div class="grid"></div><canvas id="fx" aria-hidden="true"></canvas>
<main>
  <div class="stage" id="stage" aria-hidden="true">
    <div class="card back" style="background-image:url(https://wtmttymvenjacrxytqin.supabase.co/storage/v1/object/public/cards/v1/back.jpg)"></div>
    <div class="card face" style="background-image:url(https://wtmttymvenjacrxytqin.supabase.co/storage/v1/object/public/cards/v1/JS.jpg)"></div>
  </div>
  <section class="panel" aria-labelledby="t">
    <!-- LOGO SLOT: set src on #logo (e.g. "images/logo.png") and it replaces the ♠ placeholder -->
    <div class="icon" id="iconBox"><img id="logo" alt="Derisa’s Last Card logo"><span>♠</span></div>
    <h1 id="t">Derisa’s Last Card</h1>
    <p class="tag">Your table, your card, your game</p>
    <div class="tabs" role="tablist"><button type="button" class="tab" role="tab" id="tLog" aria-selected="true">Log in</button><button type="button" class="tab" role="tab" id="tSign" aria-selected="false">Sign up</button></div>
    <form id="f" novalidate>
      <div class="field su"><label for="un">Player name</label>
        <input id="un" type="text" autocomplete="nickname" maxlength="20" placeholder="How others see you at the table"></div>
      <div class="field"><label for="em">Email</label>
        <input id="em" type="email" autocomplete="email" placeholder="you@example.com" required></div>
      <div class="field"><label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="At least 6 characters" required>
        <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path id="slash" d="M3 3l18 18" style="display:none"/></svg></button></div>
      <div class="field su"><label for="pw2">Confirm password</label>
        <input id="pw2" type="password" autocomplete="new-password" placeholder="Type the password again"></div>
      <div class="rules" id="rule"><i></i><span>Password must have at least 6 characters</span></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn go" id="go" type="submit">Log in</button>
    </form>
    <div class="or">Just want to play?</div>
    <button class="btn guest" id="guest" type="button">Play as guest</button>
    <p class="foot">Created by Deus Patrick</p>
  </section>
</main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $=s=>document.querySelector(s),em=$('#em'),pw=$('#pw'),err=$('#err'),rule=$('#rule');
// show unexpected errors on screen with file and line (helps when testing on a phone)
const where=s=>String(s||'').split('\n').slice(1,3).map(x=>x.trim().replace(/^at /,'').slice(-70)).join(' | ');
addEventListener('error',e=>{err.textContent='Error: '+e.message+' ['+String(e.filename||'').split('/').pop()+':'+e.lineno+']'});
addEventListener('unhandledrejection',e=>{const r=e.reason||{};err.textContent='Error: '+(r.message||r)+' ['+where(r.stack)+']'});
// logo slot
const logo=$('#logo');logo.onload=()=>$('#iconBox').classList.add('has');
if(logo.getAttribute('src'))logo.onload();
// show/hide password
$('#eye').onclick=e=>{const s=pw.type==='password';pw.type=s?'text':'password';$('#pw2').type=pw.type;
 e.currentTarget.setAttribute('aria-pressed',s);e.currentTarget.setAttribute('aria-label',s?'Hide password':'Show password');$('#slash').style.display=s?'block':'none'};
// live validation
const okMail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
pw.oninput=()=>{const ok=pw.value.length>=6;rule.classList.toggle('ok',ok);pw.classList.toggle('good',ok);pw.classList.toggle('bad',!ok&&pw.value.length>0)};
em.oninput=()=>{em.classList.toggle('good',okMail(em.value));em.classList.remove('bad')};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800)}
let mode='login';
function setMode(m){mode=m;document.body.dataset.mode=m;err.textContent='';
 $('#tLog').setAttribute('aria-selected',m==='login');$('#tSign').setAttribute('aria-selected',m==='signup');
 $('#go').textContent=m==='login'?'Log in':'Create account';pw.autocomplete=m==='login'?'current-password':'new-password'}
$('#tLog').onclick=()=>setMode('login');$('#tSign').onclick=()=>setMode('signup');

// ---- Supabase sign in / sign up / guest ----
const toHome=()=>{location.href='Home.html'};
const busy=on=>{$('#go').disabled=on;$('#guest').disabled=on};
const nice=m=>/invalid login/i.test(m)?'Wrong email or password.'
 :/already (been )?registered/i.test(m)?'That email already has an account. Try logging in.'
 :/rate limit|too many/i.test(m)?'Too many tries. Wait a minute and try again.'
 :/not confirmed/i.test(m)?'Confirm your email first (check your inbox).'
 :/anonymous/i.test(m)?'Guest play is switched off in the database settings.'
 :(m||'Something went wrong. Try again.');
$('#f').onsubmit=async e=>{e.preventDefault();err.textContent='';
 if(!DLC.sb){err.textContent='Cannot reach the server. Check your internet and reload.';return}
 const un=$('#un').value.trim(),p2=$('#pw2'),email=em.value.trim();
 if(mode==='signup'&&un.length<2){err.textContent='Pick a player name with at least 2 characters.';$('#un').focus();return}
 if(!okMail(email)){em.classList.add('bad');err.textContent='Enter a valid email, like name@example.com.';em.focus();return}
 if(pw.value.length<6){pw.classList.add('bad');err.textContent='Your password needs at least 6 characters.';pw.focus();return}
 if(mode==='signup'&&p2.value!==pw.value){p2.classList.add('bad');err.textContent='The two passwords don’t match.';p2.focus();return}
 busy(true);
 try{
  if(mode==='signup'){
   const r=await DLC.sb.auth.signUp({email,password:pw.value,options:{data:{nickname:un}}});
   if(r.error)throw r.error;
   if(r.data&&r.data.session){toast('Account created. Welcome, '+un+'.');setTimeout(toHome,700)}
   else toast('Check your email to confirm your account, then log in.');
  }else{
   const r=await DLC.sb.auth.signInWithPassword({email,password:pw.value});
   if(r.error)throw r.error;
   toast('Welcome back. Dealing your hand…');setTimeout(toHome,500);
  }
 }catch(x){err.textContent=nice(x&&x.message)+((x&&x.stack&&!/Wrong|already|Too many|Confirm|switched/.test(nice(x.message)))?' ['+where(x.stack)+']':'')}
 busy(false)};
$('#guest').onclick=async()=>{err.textContent='';
 if(!DLC.sb){err.textContent='Cannot reach the server. Check your internet and reload.';return}
 busy(true);
 try{const n='Guest'+(1000+Math.random()*9000|0);
  const r=await DLC.sb.auth.signInAnonymously({options:{data:{nickname:n}}});
  if(r.error)throw r.error;toast('Joined as '+n+'. Pulling up a chair…');setTimeout(toHome,500)}
 catch(x){err.textContent=nice(x&&x.message)+((x&&x.stack&&!/Wrong|already|Too many|Confirm|switched/.test(nice(x.message)))?' ['+where(x.stack)+']':'')}
 busy(false)};
console.log('DLC status:',DLC.status());
if(/nosession/.test(location.search))err.textContent='Your login was not kept when the next page opened. ('+DLC.status()+')';
// already signed in? go straight to Home
DLC.session().then(s=>{if(s)toHome()});
// card tilt
const stage=$('#stage');addEventListener('pointermove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
 stage.querySelectorAll('.card').forEach(c=>{c.style.setProperty('--ry',x*24);c.style.setProperty('--rx',-y*18)})});
// floating suit particles
const cv=$('#fx'),cx=cv.getContext('2d'),S=['♠','♥','♦','♣'];let W,H,P=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(34,W/32|0)},()=>({x:Math.random()*W,y:Math.random()*H,s:12+Math.random()*22,v:.2+Math.random()*.5,c:S[Math.random()*4|0],r:Math.random()*6}))}
size();addEventListener('resize',size);
(function loop(){cx.clearRect(0,0,W,H);for(const p of P){p.y-=p.v;p.r+=.004;if(p.y<-40){p.y=H+40;p.x=Math.random()*W}
 cx.save();cx.translate(p.x,p.y);cx.rotate(Math.sin(p.r)*.5);cx.font=p.s+'px serif';cx.fillStyle=(p.c==='♥'||p.c==='♦')?'rgba(192,36,58,.28)':'rgba(232,184,79,.22)';cx.fillText(p.c,0,0);cx.restore()}
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(loop)})();
</script>
</body>
</html>
